[build]
command = "npm run build"
functions = "netlify/functions"
publish = "dist"

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[dev]
command = "npm run dev"
functions = "netlify/functions"
port = 5173

[context.production.environment]
SUPABASE_URL = ""
SUPABASE_ANON_KEY = ""
STRIPE_SECRET_KEY = ""
STRIPE_WEBHOOK_SECRET = ""
RESEND_API_KEY = ""
SUPABASE_SERVICE_ROLE_KEY = ""
